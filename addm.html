<html lang="en">

        input,text,select{

            border: 1px solid;

        }
        label{

        }
        input[type="sumit"]{

        }
        input[type="submit"]:hover{
            background: #10d271;
        }
        
    </style>
</head>
<body>

     <label for="date" >Date Of Birth</label>
