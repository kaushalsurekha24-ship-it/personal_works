<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient </title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }
        h1,h2{
            text-align: center;
            margin-top: 20px;
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .box{

          width:600px;
          height: 300px;
          color: white;
          align-items: center;
          justify-content: center;
          font-size: 18;
          border-radius: 8px;
          box-shadow:0 5px 8px red,0 10px 8px yellow,0 15px 8px blue;

        }

        .linear-gradient{
            background-image: linear-gradient(red,yellow,green);
            width: 10%;
            height: 150px;
                   }
        .radial-gradeint{
            background-image: radial-gradient(red,yellow,green);
           
           
        }
        .conic-gradient{
            background-image:conic-gradient(red 45deg,yellow 90deg,green 180deg);
        }
        img{
            opacity: 0.1;
        }
        img{
            opacity: 1.0;
        }

    </style>
</head>
