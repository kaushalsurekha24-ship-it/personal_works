<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animated Images Using Marquee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        img {
            width: 150px;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Animated Images Using Marquee Tag</h1>

    <!-- Left to Right -->
    <h2>Left to Right Animation</h2>
    <marquee direction="right" scrollamount="5">
        <img src="https://images.ctfassets.net/y2ske730sjqp/1aONibCke6niZhgPxuiilC/2c401b05a07288746ddf3bd3943fbc76/BrandAssets_Logos_01-Wordmark.jpg?w=940
        " alt="Moving Image">
    </marquee>

    <!-- Right to Left -->
    <h2>Right to Left Animation</h2>
    <marquee direction="left" scrollamount="8">
        <img src="https://media.licdn.com/dms/image/v2/D4D0BAQExHr5cg61e6A/company-logo_200_200/company-logo_200_200/0/1722315014956/disney_hotstar_logo?e=2147483647&v=beta&t=Qd2gGUhkBChOWRIPPNbPN7z2NyKQgv020iMpR2da8ww
        " alt="Moving Image">
    </marquee>

    <!-- Up and Down -->
    <h2>Up and Down Animation</h2>
    <marquee direction="up" height="200" scrollamount="4">
        <img src="image3.jpg" alt="Moving Image">
    </marquee>

    <marquee direction="down" height="200" scrollamount="4">
        <img src="image4.jpg" alt="Moving Image">
    </marquee>

</body>
</html>
