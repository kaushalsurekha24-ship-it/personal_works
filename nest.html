<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nesting & CSS Demo</title>

    <style>
        /* Page-level styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Parent container */
        .container {
            background-color: #ffffff;
            border: 2px solid #333;
            padding: 20px;
            width: 600px;
            margin: auto;
        }

        /* Nested section */
        .container .section {
            background-color: #e3f2fd;
            border: 2px dashed #1e88e5;
            padding: 15px;
            margin-top: 15px;
        }

        /* Nested deeper */
        .container .section .box {
            background-color: #bbdefb;
            border: 2px solid #0d47a1;
            padding: 10px;
            margin-top: 10px;
        }

        /* Styling nested list items */
        .section ul li {
            color: #0d47a1;
            margin: 5px 0;
        }

        /* Only affects boxes inside section */
        .section .box p {
            color: #1a237e;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Main Container</h1>
        <p>This is the parent container.</p>

        <div class="section">
            <h2>Nested Section</h2>
            <p>This section is inside the container.</p>

            <ul>
                <li>Item One</li>
                <li>Item Two</li>
                <li>Item Three</li>
            </ul>

            <div class="box">
                <p>Deeply Nested Box</p>
                <p>This box is inside the section.</p>
            </div>
        </div>
    </div>

</body>
</html>
